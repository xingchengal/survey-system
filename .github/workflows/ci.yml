# ============================================================
# 持续集成：每次 push / PR 自动编译 + 跑测试
# ============================================================
# ★ 为什么加它（评审【工程性·低】"无 CI 流水线与静态检查插件"）：
#   本项目最脆弱的是安全逻辑（PBKDF2 平滑迁移、三级可见性、白名单身份注入），
#   而这些地方历史上正是"反复出问题又被修回来"。没有 CI 时，任何破坏性改动
#   都只能靠人工发现 —— 现在至少有编译 + 单测这两道自动闸门。
#
# ★ 关于测试范围（重要，第十六轮改过写法、第二十七/二十八轮又扩了两类）：
#   **默认跑全部纯单元测试 + MockMvc 全栈测试（都不连库）**；被排除的有两类：
#     1. `SurveyBackendApplicationTests`（`@SpringBootTest contextLoads`，需要真实 MySQL）；
#     2. `SurveyFlowIntegrationTest`（真库全链路集成测试，需要独立的空库）。
#   排除规则写在 `survey-backend/pom.xml` 的 maven-surefire-plugin `<excludes>` 里，
#   所以这里直接 `./mvnw test` 即可。
#   ★ 第 2 类由下面的 `backend-integration` 作业单独跑：它自带一个 MySQL 8 service，
#     先导入 sql/init.sql，再用 `-Dtest=SurveyFlowIntegrationTest`（会覆盖 excludes）。
#   ★ 真库测试**只连 survey_db_test**（独立的空库），绝不指向开发/演示库。
#
#   ★ 为什么改成"默认全跑"（第十六轮的真实教训）：
#     原来这里是 `-Dtest=UserServiceTest,JwtAuthFilterTest,...` **逐个列类名**。两个毛病：
#       ① **新增测试类必须手工加进这个列表**，忘了就静默不跑 ——
#          第十六轮新增的 `SurveyControllerRoutingTest`（专门防"端点被误删"的回归测试）
#          就是这么漏掉的，而且这个列表当时已经落后 3 轮（缺 TextLimits/SqlLikeEscaper/
#          AnswerServiceGuard 三个类），是用户提醒才发现；
#       ② 列表里的类一旦重命名/删除，CI 会直接**编译失败**，报错还指向 CI 而不是代码。
#     现在新增测试类**不需要改这个文件**，也不会再静默漏跑。
#
# ★ 关于"静态检查"这一步（评审【工程性·低】建议加 Checkstyle / Spotless / 覆盖率）：
#   **本机离线仓库里没有这些插件**（checkstyle-maven-plugin / spotless-maven-plugin /
#   jacoco-maven-plugin 均不存在），而沙箱不允许联网写 ~/.m2，所以这一轮无法接入。
#   替代做法是把测试补到覆盖面够用（当前默认全跑 **505 例 / 55 类**，另有 2 个真库测试），
#   把新增的安全/路由逻辑纳入闸门 —— 这些正是历史上反复出问题的地方。
#   接入静态检查插件需要一次联网构建，留给下一轮或你自己在有网的机器上做。
#
# ★ 关于前端构建：
#   前端用 Vite 8 + Node 22，构建只验证"能打包"，不做视觉/交互测试。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  backend:
    name: 后端编译 + 单元测试（JDK 17）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: survey-backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ★ 为什么这里用 ./mvnw 而不是 setup-java 提供的 mvn（第十二轮改动）：
      #   ① CI 本身就是一次"干净 clone"，用 wrapper 能把 **"Maven Wrapper 是否完整可用"
      #      变成自动化闸门** —— 这正是它实际出过问题的地方：
      #      根 .gitignore 里的 `/survey-backend/.mvn/` 让 maven-wrapper.properties 进不了库，
      #      于是"本地能跑、别人 clone 后 mvnw 直接不可用"，而且没有任何提示。
      #   ② 锁定 Maven 版本（wrapper 声明的是 3.9.16），避免"本地能过、CI 不过"的版本差异。
      #   ★ 两个前置条件（本轮都已具备）：
      #     · .mvn/wrapper/maven-wrapper.properties 必须入库；
      #     · mvnw 在 git 索引里必须带可执行位（100755），否则 Linux 上 `./mvnw` 会 Permission denied。
      - name: 编译（Maven Wrapper）
        run: ./mvnw -B -q -DskipTests compile

      # ★ 不需要再列类名：pom 里 maven-surefire-plugin 的 <excludes> 只排除了三个连库的测试
      #   （SurveyBackendApplicationTests / SurveyFlowIntegrationTest / WalletConcurrencyTest），
      #   其余测试类**全部自动纳入**。
      #   当前应为 **359 个用例 / 43 个测试类**（★ 数量变化时只需更新这行注释，不用改命令）。
      #
      # ★ why `-Pcoverage`：jacoco 放在 pom 的 **coverage profile** 里（默认不启用）。
      #   本地日常是离线构建（`-o test`），把 jacoco 无条件挂上去会让 `-o` 直接失败
      #   （插件不在多数人 ~/.m2 里）；CI 有网，显式激活即可。
      - name: 单元测试 + MockMvc 全栈测试 + 覆盖率（不依赖数据库，Maven Wrapper）
        run: ./mvnw -B -Pcoverage test

      # 覆盖率报告：既是产物（可下载看 HTML），也在 job summary 里给一段人话摘要。
      # ★ 不设强制阈值（fail if below）：覆盖率是"看趋势"的指标，
      #   用阈值卡 CI 只会逼人写凑数的测试；本项目真正的不变量由 343 个用例本身保证。
      - name: 汇总覆盖率（读 jacoco.csv 写进 job summary）
        if: always()
        run: |
          # ★ 注意路径：本作业的 defaults.run.working-directory 是 survey-backend，
          #   所以这里用**相对仓库子目录**的路径，不能写 survey-backend/target/...
          #   （下面 upload-artifact 的 path 相反 —— action 的路径相对**仓库根**。）
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "未生成 jacoco.csv（测试步骤可能失败），跳过" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$CSV" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1], encoding='utf-8')))
          def pct(missed, covered):
              m = sum(int(r[missed]) for r in rows); c = sum(int(r[covered]) for r in rows)
              return 0.0 if m + c == 0 else 100.0 * c / (m + c)
          print("## 后端测试覆盖率（JaCoCo）\n")
          print("| 指标 | 覆盖率 |")
          print("|---|---|")
          print(f"| 指令 | {pct('INSTRUCTION_MISSED','INSTRUCTION_COVERED'):.1f}% |")
          print(f"| 分支 | {pct('BRANCH_MISSED','BRANCH_COVERED'):.1f}% |")
          print(f"| 行 | {pct('LINE_MISSED','LINE_COVERED'):.1f}% |")
          print("\n> 分包看：`common`/`aspect`（核心不变量）约 90%，`service` 约 68%，`controller` 约 16%")
          print("> （Controller 主要是参数转发，业务分支在 Service；它的鉴权路径由 MockMvc 矩阵覆盖）。")
          PY

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: survey-backend/target/site/jacoco/
          # ★ 合法值只有 warn / error / ignore —— 写 warning 会让整个作业红（v4 校验更严）。
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # 真库集成测试（第二十八轮新增）
  #   一条完整链路：注册 → 建卷 → 存题 → 发布 → 匿名提交 → 统计 → 分页 → Excel 导出 → 删除。
  #   单元测试把 Mapper 全 mock 掉，验不到 SQL/事务/导出；这个作业补的就是那一段。
  #   ★ 用 GitHub Actions 的 service 容器起 MySQL 8（不需要 Docker Desktop，也不用 Testcontainers）。
  #   ★ 只连 survey_db_test（独立的空库），不碰任何开发/演示数据。
  # ============================================================
  backend-integration:
    name: 后端集成测试（真实 MySQL 8）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: survey_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ★ 集成测试连的是**空库**：先建表（sql/init.sql 只含结构、不含数据）。
      - name: 导入表结构（sql/init.sql → survey_db_test）
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -ptest --default-character-set=utf8mb4 \
            survey_db_test < sql/init.sql
          mysql -h127.0.0.1 -P3306 -uroot -ptest -N -e \
            "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='survey_db_test'"

      # ★ -Dtest= 会覆盖 pom 里 surefire 的 <excludes>，所以这里可以点名跑那个"默认不跑"的类。
      - name: 集成测试（真实 MySQL，Maven Wrapper）
        working-directory: survey-backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/survey_db_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test
        run: ./mvnw -B "-Dtest=SurveyFlowIntegrationTest" test

  frontend:
    name: 前端构建（Node 22）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: survey-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: survey-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # ★ F5：依赖漏洞闸门。
      #   为什么只卡 high 及以上：`npm audit` 连 low/moderate 一起报的时候噪音很大
      #   （间接依赖的 DoS / ReDoS 提示常年存在），会把真正的"能被打"的漏洞淹掉。
      #   当前基线是 **0 vulnerabilities**（2026-10-18 本地实测），所以加它不会一上来就红。
      #   ★ 它不是"永久的绿"：将来新披露的漏洞会让这里变红 —— 那正是它该做的事。
      - name: 依赖漏洞扫描（high 及以上）
        run: npm audit --audit-level=high

      - name: ESLint 检查
        run: npx eslint .

      - name: 构建
        run: npx vite build

  # ============================================================
  # 文档一致性检查（新增）
  #   四份主文档的“数字唯一出处”靠人工维护必然漂移；这个作业把
  #   端点四表一致、§四权限点、相对链接、README 规模、历史叙事泄漏
  #   变成每次 push 都会跑的闸门。脚本本身只读，不改文件。
  # ============================================================
  docs:
    name: 文档一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 四份主文档一致性
        run: node tools/check-docs.mjs

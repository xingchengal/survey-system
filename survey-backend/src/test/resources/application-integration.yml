# ============================================================
# 集成测试专用配置（只被 SurveyFlowIntegrationTest 使用）
#
# ★ 为什么单独一份：集成测试要连**真的 MySQL**，而普通单测必须"零依赖"。
#   两套配置混在一起，任何一个环境缺库都会让另一套测试跟着红。
#
# ★ 库从哪来：一个**独立的空库**（默认 survey_db_test），结构用 sql/init.sql 导入。
#   绝不指向 survey_db —— 那是开发/演示用的活库，测试会写数据。
#
# ★ 环境变量（本机 / CI 都能覆盖）：
#   TEST_DB_URL      默认 jdbc:mysql://127.0.0.1:3306/survey_db_test
#   TEST_DB_USER     默认 root
#   TEST_DB_PASSWORD 默认空（本机请显式传，别把口令写进仓库）
# ============================================================
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/survey_db_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USER:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 测试自带密钥（JwtUtil 启动即校验 ≥32 字节；真实密钥只在 application-local.yml / 环境变量里）
jwt:
  secret: ${TEST_JWT_SECRET:integration-test-only-secret-0123456789abcdef}

app:
  cache:
    # 缓存关闭：集成测试断言的是"库里的真实结果"，不能让 Redis 的 TTL 影响期望值
    stats-enabled: false
  rate-limit:
    # 限流回退进程内：CI 没有 Redis，不能因为连不上而拖慢每个请求
    redis-enabled: false

logging:
  level:
    root: warn
    com.survey: warn
